name: Automated Release with Changelog

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'VERSION'
      - 'CHANGELOG.md'
  workflow_dispatch:

jobs:
  changelog:
    name: Generate Changelog and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Get current version
        id: current_version
        shell: bash
        run: |
          if [ -f VERSION ]; then
            CURRENT=$(cat VERSION)
          else
            CURRENT="0.0.0"
            echo "0.0.0" > VERSION
          fi
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new_version
        shell: bash
        run: |
          CURRENT="${{ steps.current_version.outputs.current }}"
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)
          
          PATCH=$((PATCH + 1))
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update VERSION file
        shell: bash
        run: |
          echo "${{ steps.new_version.outputs.version }}" > VERSION

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          TAG="v${{ steps.new_version.outputs.version }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Generate changelog from commits
        id: changelog
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          
          # Try to find previous tag, or use root commit
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            # First release - get all commits up to this point
            COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse 2>/dev/null || echo "")
          else
            # Subsequent release - get commits since last tag
            COMMITS=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s (%h)" --reverse 2>/dev/null || echo "")
          fi
          
          # If no commits found, provide default message
          if [ -z "$COMMITS" ]; then
            COMMITS="- Initial release"
          fi
          
          # Organize commits by type
          FEATURES=$(echo "$COMMITS" | grep -E "^- (feat|feature):" || true)
          FIXES=$(echo "$COMMITS" | grep -E "^- (fix|bugfix):" || true)
          IMPROVEMENTS=$(echo "$COMMITS" | grep -E "^- (chore|refactor|perf):" || true)
          DOCS=$(echo "$COMMITS" | grep -E "^- (docs|doc):" || true)
          OTHER=$(echo "$COMMITS" | grep -vE "^- (feat|feature|fix|bugfix|chore|refactor|perf|docs|doc):" || true)
          
          # Build changelog
          CHANGELOG=""
          
          if [ -n "$FEATURES" ]; then
            CHANGELOG="$CHANGELOG## ✨ Features\n$FEATURES\n\n"
          fi
          
          if [ -n "$FIXES" ]; then
            CHANGELOG="$CHANGELOG## 🐛 Bug Fixes\n$FIXES\n\n"
          fi
          
          if [ -n "$IMPROVEMENTS" ]; then
            CHANGELOG="$CHANGELOG## 🔧 Improvements & Maintenance\n$IMPROVEMENTS\n\n"
          fi
          
          if [ -n "$DOCS" ]; then
            CHANGELOG="$CHANGELOG## 📚 Documentation\n$DOCS\n\n"
          fi
          
          if [ -n "$OTHER" ]; then
            CHANGELOG="$CHANGELOG## 📝 Other Changes\n$OTHER\n\n"
          fi
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Automated release of C# Learning Content"
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get commit count and contributors
        id: stats
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "0")
            CONTRIBUTORS=$(git log --format="%an" 2>/dev/null | sort -u | wc -l || echo "1")
          else
            COMMIT_COUNT=$(git rev-list --count "$PREV_TAG..HEAD" 2>/dev/null || echo "0")
            CONTRIBUTORS=$(git log "$PREV_TAG..HEAD" --format="%an" 2>/dev/null | sort -u | wc -l || echo "1")
          fi
          
          echo "commits=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "contributors=$CONTRIBUTORS" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        id: update_changelog
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          DATE=$(date -u +'%Y-%m-%d')
          
          if [ ! -f CHANGELOG.md ]; then
            touch CHANGELOG.md
          fi
          
          {
            echo "## [$TAG] - $DATE"
            echo ""
            echo "${{ steps.changelog.outputs.changelog }}"
            echo ""
            cat CHANGELOG.md
          } > CHANGELOG.md.tmp
          
          mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Commit and push changes
        run: |
          git add VERSION CHANGELOG.md
          git commit -m "chore: release ${{ steps.tag.outputs.tag }} [skip ci]" || true
          git push origin main || true
          git tag -a "${{ steps.tag.outputs.tag }}" -m "Release ${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}" || true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ## ${{ steps.tag.outputs.tag }}
            
            📊 **Release Statistics**
            - **Commits:** ${{ steps.stats.outputs.commits }}
            - **Contributors:** ${{ steps.stats.outputs.contributors }}
            - **Date:** ${{ github.event.repository.updated_at }}
            
            ---
            
            ## 📋 Changelog
            
            ${{ steps.changelog.outputs.changelog }}
            
            ---
            
            ### 🎓 Learning Resources
            
            This release includes updates to the C# learning content. Check the following folders for new material:
            
            - 📖 [01-Fundamentals](https://github.com/${{ github.repository }}/tree/main/01-Fundamentals)
            - 🏗️ [02-OOP](https://github.com/${{ github.repository }}/tree/main/02-OOP)
            - 🚀 [03-Advanced-Features](https://github.com/${{ github.repository }}/tree/main/03-Advanced-Features)
            - 🔍 [04-LINQ](https://github.com/${{ github.repository }}/tree/main/04-LINQ)
            - ⚡ [05-Async-Programming](https://github.com/${{ github.repository }}/tree/main/05-Async-Programming)
            
            ### 🙏 Thank You
            
            Thanks to all contributors who helped make this release possible!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: changelog
    if: success()

    steps:
      - name: Create deployment status
        run: |
          echo "✅ Release has been successfully created!"
          echo "📦 Check the release page for detailed information"
          echo "📝 Changelog has been automatically updated"
