name: CI/CD Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '.github/workflows/ci-validation.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore
        continue-on-error: true

      - name: Code format check (dotnet format)
        run: |
          dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true

      - name: Check for code style issues
        id: code_style
        run: |
          echo "Checking C# code formatting..."
          # Using dotnet format to check
          if dotnet format --verify-no-changes 2>&1; then
            echo "✅ Code formatting is correct"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Code formatting issues found"
            echo "status=warning" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Run build
        id: build
        run: |
          echo "Building C# projects..."
          dotnet build --no-restore --configuration Release
        continue-on-error: true

      - name: Check for compilation errors
        if: failure()
        run: |
          echo "::warning::Build completed with warnings or errors"

      - name: File naming validation
        id: file_naming
        run: |
          echo "Validating file naming conventions..."
          
          # Check for proper C# naming
          ISSUES=0
          
          # Check for files not following naming convention
          for file in $(find . -name "*.cs" -not -path "./.git/*" -not -path "./bin/*" -not -path "./obj/*"); do
            # C# files should be PascalCase or match namespace
            if [[ "$file" =~ [a-z]+\.cs$ ]]; then
              echo "⚠️ Warning: $file might not follow PascalCase naming"
            fi
          done
          
          echo "✅ File naming validation complete"

      - name: Documentation check
        id: docs
        run: |
          echo "Checking for documentation..."
          
          CSHARP_FILES=$(find . -name "*.cs" -not -path "./.git/*" -not -path "./bin/*" -not -path "./obj/*" | wc -l)
          FILES_WITH_COMMENTS=$(find . -name "*.cs" -not -path "./.git/*" -not -path "./bin/*" -not -path "./obj/*" -exec grep -l "^[[:space:]]*//" {} \; | wc -l)
          
          echo "Total C# files: $CSHARP_FILES"
          echo "Files with comments: $FILES_WITH_COMMENTS"
          
          if [ $CSHARP_FILES -gt 0 ]; then
            PERCENTAGE=$((FILES_WITH_COMMENTS * 100 / CSHARP_FILES))
            echo "📊 Documentation coverage: $PERCENTAGE%"
            
            if [ $PERCENTAGE -lt 30 ]; then
              echo "::warning::Documentation coverage is below 30%"
            fi
          fi

      - name: Check for common issues
        id: common_issues
        run: |
          echo "Scanning for common C# issues..."
          
          # Check for TODO comments
          TODO_COUNT=$(grep -r "TODO\|FIXME\|HACK\|XXX" --include="*.cs" . 2>/dev/null | grep -v ".git" | wc -l)
          if [ $TODO_COUNT -gt 0 ]; then
            echo "⚠️ Found $TODO_COUNT TODO/FIXME comments"
            echo "::warning::Found $TODO_COUNT TODO/FIXME comments in the code"
          fi
          
          # Check for commented-out code
          COMMENTED_CODE=$(grep -r "^[[:space:]]*//" --include="*.cs" . 2>/dev/null | grep -v ".git" | grep -v "///" | wc -l)
          if [ $COMMENTED_CODE -gt 10 ]; then
            echo "⚠️ Found significant amount of commented-out code ($COMMENTED_CODE lines)"
          fi

      - name: Validate README files
        id: readme
        run: |
          echo "Checking for README files..."
          
          MISSING_READMES=0
          
          # Check main README
          if [ ! -f README.md ]; then
            echo "::warning::Missing main README.md"
            MISSING_READMES=$((MISSING_READMES + 1))
          else
            echo "✅ Main README.md found"
          fi
          
          # Check for folder READMEs
          for dir in 0*-*/; do
            if [ ! -f "$dir/README.md" ]; then
              echo "::warning::Missing README.md in $dir"
              MISSING_READMES=$((MISSING_READMES + 1))
            fi
          done
          
          if [ $MISSING_READMES -eq 0 ]; then
            echo "✅ All required README files are present"
          fi

      - name: Create code quality report
        if: always()
        run: |
          cat > /tmp/quality_report.md << 'EOF'
          # Code Quality Report
          
          ## Summary
          - **Build Status**: ${{ steps.build.outcome }}
          - **Code Style**: ${{ steps.code_style.outcome }}
          - **File Naming**: Checked
          - **Documentation**: Checked
          
          ## Details
          
          ### Build
          - Project: C# Learning Content
          - Configuration: Release
          - Status: ${{ steps.build.outcome }}
          
          ### Code Style
          - Status: ${{ steps.code_style.outcome }}
          
          ### Documentation
          - All README files should be present in main folders
          - C# files should include XML documentation comments
          
          ## Recommendations
          1. Keep code formatted consistently using dotnet format
          2. Add documentation comments to public members
          3. Address all TODO/FIXME comments before release
          4. Ensure each folder has a README.md
          
          EOF
          cat /tmp/quality_report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = '${{ steps.build.outcome }}';
            const codeStyle = '${{ steps.code_style.outcome }}';
            
            let comment = '## ✅ CI/CD Validation Results\n\n';
            
            if (buildStatus === 'success') {
              comment += '- ✅ Build: Passed\n';
            } else {
              comment += '- ❌ Build: Failed\n';
            }
            
            if (codeStyle === 'success' || codeStyle === 'skipped') {
              comment += '- ✅ Code Style: Passed\n';
            } else {
              comment += '- ⚠️ Code Style: Warning\n';
            }
            
            comment += '\n**Note:** Run `dotnet format` locally to fix formatting issues.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  markdown-lint:
    name: Markdown Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint markdown files
        run: |
          echo "Checking markdown files..."
          markdownlint -c .markdownlint.json '**/*.md' || true
        continue-on-error: true

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check folder structure
        run: |
          echo "Validating repository structure..."
          
          REQUIRED_FOLDERS=(
            "01-Fundamentals"
            "02-OOP"
            "03-Advanced-Features"
            "04-LINQ"
            "05-Async-Programming"
            "06-System-Design"
            "06-Web-Development"
            "07-Database-Access"
            "08-Testing"
            "10-Interview-Prep"
          )
          
          MISSING=0
          
          for folder in "${REQUIRED_FOLDERS[@]}"; do
            if [ -d "$folder" ]; then
              echo "✅ $folder exists"
            else
              echo "⚠️ $folder missing"
              MISSING=$((MISSING + 1))
            fi
          done
          
          if [ $MISSING -eq 0 ]; then
            echo ""
            echo "✅ All required folders are present"
          else
            echo ""
            echo "⚠️ $MISSING required folders are missing"
          fi

      - name: Validate learning path
        run: |
          echo "Validating learning path structure..."
          
          # Check for explanation files
          for dir in 0*/; do
            if [ -f "$dir/01-Explanation/README.md" ] || [ -d "$dir/01-Explanation" ]; then
              echo "✅ $dir has explanation content"
            else
              echo "⚠️ $dir missing explanation content"
            fi
          done

  results:
    name: Validation Results
    runs-on: ubuntu-latest
    needs: [code-quality, markdown-lint, documentation]
    if: always()
    permissions:
      checks: write

    steps:
      - name: Check validation results
        run: |
          echo "## Validation Summary"
          echo "- Code Quality: ${{ needs.code-quality.result }}"
          echo "- Markdown Lint: ${{ needs.markdown-lint.result }}"
          echo "- Documentation: ${{ needs.documentation.result }}"

      - name: Fail if critical checks failed
        if: needs.code-quality.result == 'failure' || needs.documentation.result == 'failure'
        run: |
          echo "::error::Critical validation checks failed"
          exit 1
