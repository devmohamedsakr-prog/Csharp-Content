name: Markdown Linting on PR

on:
  pull_request:
    paths:
      - '**.md'
      - '.markdownlint.json'
  workflow_dispatch:

jobs:
  markdown-lint:
    name: Lint Markdown Files
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.md

      - name: Setup Node.js
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Install markdownlint
        if: steps.changed-files.outputs.any_changed == 'true'
        run: npm install -g markdownlint-cli
        shell: bash

      - name: Run markdownlint
        if: steps.changed-files.outputs.any_changed == 'true'
        id: lint
        run: |
          echo "Linting changed markdown files..."
          LINT_RESULT=$(markdownlint -c .markdownlint.json ${{ steps.changed-files.outputs.all_changed_files }} 2>&1 || true)
          
          if [ -n "$LINT_RESULT" ]; then
            echo "lint_failed=true" >> $GITHUB_OUTPUT
            {
              echo "LINT_OUTPUT<<EOF"
              echo "$LINT_RESULT"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "lint_failed=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
        shell: bash

      - name: Comment on PR with lint results
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true' && steps.lint.outputs.lint_failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const lintOutput = `${{ steps.lint.outputs.LINT_OUTPUT }}`;
            
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 📝 Markdown Linting Report\n\n\`\`\`\n${lintOutput}\n\`\`\`\n\n**To fix issues locally:**\n\`\`\`bash\nnpm install\nnpm run lint:md:fix\n\`\`\``
              });
            } catch (error) {
              console.error('Failed to create comment:', error);
            }

      - name: Fail if linting failed
        if: steps.lint.outputs.lint_failed == 'true'
        run: |
          echo "❌ Markdown linting failed"
          echo "${{ steps.lint.outputs.LINT_OUTPUT }}"
          exit 1
        shell: bash

      - name: Success comment
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true' && steps.lint.outputs.lint_failed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ All markdown files passed linting checks!'
              });
            } catch (error) {
              console.error('Failed to create success comment:', error);
            }
