# Labeler workflow - automatically applies labels to PRs based on files changed
# Uses GitHub Actions labeler v5
name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  apply-labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run labeler
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labelers.yml
