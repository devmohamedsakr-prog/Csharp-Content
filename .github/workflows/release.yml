name: Automated Release with Changelog

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  changelog:
    name: Generate Changelog and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG=${{ github.ref_name }}
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Generate changelog from commits
        id: changelog
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          
          # Try to find previous tag, or use root commit
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG"^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            # First release - get all commits up to this tag
            COMMITS=$(git log "$TAG" --pretty=format:"- %s (%h)" --reverse 2>/dev/null || echo "")
          else
            # Subsequent release - get commits between tags
            COMMITS=$(git log "$PREV_TAG..$TAG" --pretty=format:"- %s (%h)" --reverse 2>/dev/null || echo "")
          fi
          
          # If no commits found, provide default message
          if [ -z "$COMMITS" ]; then
            COMMITS="- Initial release"
          fi
          
          # Organize commits by type
          FEATURES=$(echo "$COMMITS" | grep -E "^- (feat|feature):" || true)
          FIXES=$(echo "$COMMITS" | grep -E "^- (fix|bugfix):" || true)
          IMPROVEMENTS=$(echo "$COMMITS" | grep -E "^- (chore|refactor|perf):" || true)
          DOCS=$(echo "$COMMITS" | grep -E "^- (docs|doc):" || true)
          OTHER=$(echo "$COMMITS" | grep -vE "^- (feat|feature|fix|bugfix|chore|refactor|perf|docs|doc):" || true)
          
          # Build changelog
          CHANGELOG=""
          
          if [ -n "$FEATURES" ]; then
            CHANGELOG="$CHANGELOG## ✨ Features\n$FEATURES\n\n"
          fi
          
          if [ -n "$FIXES" ]; then
            CHANGELOG="$CHANGELOG## 🐛 Bug Fixes\n$FIXES\n\n"
          fi
          
          if [ -n "$IMPROVEMENTS" ]; then
            CHANGELOG="$CHANGELOG## 🔧 Improvements & Maintenance\n$IMPROVEMENTS\n\n"
          fi
          
          if [ -n "$DOCS" ]; then
            CHANGELOG="$CHANGELOG## 📚 Documentation\n$DOCS\n\n"
          fi
          
          if [ -n "$OTHER" ]; then
            CHANGELOG="$CHANGELOG## 📝 Other Changes\n$OTHER\n\n"
          fi
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Initial release of C# Learning Content"
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No commits found for this release"
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get commit count and contributors
        id: stats
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG"^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            COMMIT_COUNT=$(git rev-list --count "$TAG" 2>/dev/null || echo "0")
            CONTRIBUTORS=$(git log "$TAG" --format="%an" 2>/dev/null | sort -u | wc -l || echo "1")
          else
            COMMIT_COUNT=$(git rev-list --count "$PREV_TAG..$TAG" 2>/dev/null || echo "0")
            CONTRIBUTORS=$(git log "$PREV_TAG..$TAG" --format="%an" 2>/dev/null | sort -u | wc -l || echo "1")
          fi
          
          echo "commits=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "contributors=$CONTRIBUTORS" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ## ${{ steps.tag.outputs.tag }}
            
            📊 **Release Statistics**
            - **Commits:** ${{ steps.stats.outputs.commits }}
            - **Contributors:** ${{ steps.stats.outputs.contributors }}
            - **Date:** ${{ github.event.repository.updated_at }}
            
            ---
            
            ## 📋 Changelog
            
            ${{ steps.changelog.outputs.changelog }}
            
            ---
            
            ### 🎓 Learning Resources
            
            This release includes updates to the C# learning content. Check the following folders for new material:
            
            - 📖 [01-Fundamentals](https://github.com/${{ github.repository }}/tree/main/01-Fundamentals)
            - 🏗️ [02-OOP](https://github.com/${{ github.repository }}/tree/main/02-OOP)
            - 🚀 [03-Advanced-Features](https://github.com/${{ github.repository }}/tree/main/03-Advanced-Features)
            - 🔍 [04-LINQ](https://github.com/${{ github.repository }}/tree/main/04-LINQ)
            - ⚡ [05-Async-Programming](https://github.com/${{ github.repository }}/tree/main/05-Async-Programming)
            
            ### 🙏 Thank You
            
            Thanks to all contributors who helped make this release possible!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print summary
        shell: bash
        run: |
          echo "✅ Release workflow execution complete"
          echo "📌 Release tag: ${{ steps.tag.outputs.tag }}"
          echo "📊 Commits: ${{ steps.stats.outputs.commits }}"
          echo "👥 Contributors: ${{ steps.stats.outputs.contributors }}"

      - name: Update CHANGELOG.md
        id: update_changelog
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          DATE=$(date -u +'%Y-%m-%d')
          
          if [ ! -f CHANGELOG.md ]; then
            touch CHANGELOG.md
          fi
          
          {
            echo "## [$TAG] - $DATE"
            echo ""
            echo "${{ steps.changelog.outputs.changelog }}"
            echo ""
            cat CHANGELOG.md
          } > CHANGELOG.md.tmp
          
          mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Commit CHANGELOG.md
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG for ${{ steps.tag.outputs.tag }}" || true
          git push origin main || true

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: changelog
    if: success()

    steps:
      - name: Create deployment status
        run: |
          echo "✅ Release ${{ github.ref_name }} has been successfully created!"
          echo "📦 Check the release page for detailed information"
          echo "📝 Changelog has been automatically updated"
